# FAQ
faq.title=Frequently Asked Questions
faq.q1=Is Syntora suitable for small housing societies?
faq.a1=Yes. Syntora is designed for societies of all sizes, whether you have 20 flats or 200.
faq.q2=Does Syntora require installation?
faq.a2=No installation required. Syntora is a web-based platform that works directly from your browser.
faq.q3=Is my society data secure?
faq.a3=Yes. Syntora uses secure access control and role-based permissions to ensure that your society\u2019s data remains protected.
faq.q4=How affordable is Syntora?
faq.a4=Syntora is built as an affordable Indian SaaS solution. Pricing is designed to suit housing societies without adding financial burden.

