# About
about.title=Why Choose Syntora?
about.lead=Built for Indian housing societies that need simplicity and affordability.
about.p1=Managing maintenance collections, resident records, and society communication can be time-consuming and manual. Syntora simplifies these everyday tasks through a secure and easy-to-use web platform.
about.p2=Whether your society has 20 flats or 200, Syntora helps reduce paperwork, improve transparency, and keep everything organized digitally.

