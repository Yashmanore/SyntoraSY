<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Language | Syntora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #dde6f2);
            font-family: "Segoe UI", sans-serif;
        }

        .lang-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lang-card {
            background: #ffffff;
            padding: 50px 40px;
            width: 100%;
            max-width: 850px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            animation: fadeIn 0.6s ease-in-out;
        }

        .logo img {
            max-height: 135px;
        }

        .brand-tagline {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 6px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .subtext {
            color: #111827;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtext-hindi {
            color: #374151;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .lang-btn {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 16px 10px;
            font-size: 18px;
            border-radius: 12px;
            color: #111827;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.25s ease;
        }

        .lang-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .lang-wrapper::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201,162,39,0.15), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .lang-card {
            position: relative;
            z-index: 1;
        }

        .lang-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            border-color: #c9a227;
            background: #fffdf7;
            color: #000;
        }

        .lang-btn:active {
            transform: scale(0.97);
        }

        .footer-note {
            margin-top: 30px;
            font-size: 13px;
            color: #9ca3af;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .default-lang {
            border: 2px solid #c9a227;
            background: #fffdf7;
        }
    </style>
</head>

<body>

<div class="lang-wrapper">
    <div class="lang-card">

        <!-- Branding -->
        <div class="logo mb-4">
            <img src="/images/syntora.png" alt="Syntora Logo">
            <div class="brand-tagline">
                Smart Society Management Simplified
            </div>
        </div>

        <!-- Instructions -->
        <div class="subtext">
            Select your Preferred Language to Enter the Website
        </div>
        <div class="subtext-hindi">
            वेबसाइट में प्रवेश करने के लिए अपनी पसंदीदा भाषा का चयन करें
        </div>

        <!-- Language Buttons -->
        <div class="lang-grid">

            <a href="/home?lang=en" class="lang-btn">🌐 English</a>
            <a href="/home?lang=hi" class="lang-btn">🇮🇳 हिन्दी</a>
            <a href="/home?lang=mr" class="lang-btn">🇮🇳 मराठी</a>


            <!-- Future languages (enable later) -->
            <!--
            <a href="/home?lang=gu" class="lang-btn" lang="gu">ગુજરાતી</a>
            <a href="/home?lang=ta" class="lang-btn" lang="ta">தமிழ்</a>
            <a href="/home?lang=te" class="lang-btn" lang="te">తెలుగు</a>
            <a href="/home?lang=kn" class="lang-btn" lang="kn">ಕನ್ನಡ</a>
            <a href="/home?lang=bn" class="lang-btn" lang="bn">বাংলা</a>
            <a href="/home?lang=pa" class="lang-btn" lang="pa">ਪੰਜਾਬੀ</a>
            -->

        </div>

        <div class="footer-note">
            Secure • Simple • Trusted by Growing Communities
        </div>

    </div>
</div>

</body>
