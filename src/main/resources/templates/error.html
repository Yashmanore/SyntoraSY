<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Syntora</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2ebf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 48px 40px;
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        .error-icon {
            font-size: 64px;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 10px;
        }
        .error-msg {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .error-detail {
            background: #fef3c7;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 12px;
            margin: 18px 0;
            font-size: 13px;
            color: #92400e;
        }
        .btn-login {
            display: inline-block;
            background: #315e87;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover { background: #254a6d; color: white; }
        .btn-back {
            display: inline-block;
            background: transparent;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            margin-left: 8px;
        }
        .btn-back:hover { background: #f3f4f6; color: #374151; }
        .logo {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 28px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h1 class="error-title">Access Denied or Session Expired</h1>
        <p class="error-msg">You don't have permission to view this page, or your session has expired.</p>

        <div class="error-detail" th:if="${error}">
            <i class="bi bi-info-circle me-1"></i>
            <span th:text="${error}">Error details</span>
        </div>
        <div class="error-detail" th:unless="${error}">
            <i class="bi bi-info-circle me-1"></i>
            Please log in as an admin to access this page.
        </div>

        <div>
            <a href="/login" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Go to Login
            </a>
            <a href="javascript:history.back()" class="btn-back">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </a>
        </div>

        <p class="logo">Syntora Society Management</p>
    </div>
</body>
</html>
