<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head th:replace="fragments/header :: head"></head>

<body>

<style>
    .hero-section {
        background: linear-gradient(135deg, #f8fafc, #e8edf3);
        padding-bottom: 100px;
    }

    body {
        padding-top: 80px;
    }

    .syntora-btn {
        background: #c9a227;
        color: white;
        border: none;
        padding: 14px 40px;
        border-radius: 40px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .syntora-btn:hover {
        background: #b48e1d;
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    .feature-card {
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        padding: 2rem;
        background-color: #ffffff;
        transition: all 0.3s ease;
    }

    .feature-card:hover {
        transform: translateY(-12px);
        box-shadow: 0 25px 60px rgba(0,0,0,0.12);
    }

    .section-title {
        font-size: 2.3rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 2rem;
        position: relative;
    }

    .section-title::after {
        content: "";
        width: 70px;
        height: 4px;
        background: #c9a227;
        display: block;
        margin: 15px auto 0;
        border-radius: 2px;
    }
</style>

<div th:replace="fragments/header :: body"></div>

<!-- HERO -->
<section class="hero-section py-5 text-center mt-5 pt-5">
    <div class="container">

        <h1 class="display-4 fw-bold"
            th:text="#{hero.title}">
        </h1>

        <p class="lead mt-3"
           th:text="#{hero.subtitle}">
        </p>

        <a href="/login"
           class="btn btn-lg mt-4 syntora-btn"
           th:text="#{hero.cta}">
        </a>

        <p class="mt-3 text-muted small"
           th:text="#{hero.note}">
        </p>

    </div>
</section>

<!-- ABOUT -->
<section id="about-us" class="py-5">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-md-6">
                <img src="/images/about-us.png"
                     class="img-fluid rounded shadow"
                     style="height: 450px; width: 100%; object-fit: cover;"
                     alt="About Syntora">
            </div>

            <div class="col-md-6">

                <h2 th:text="#{about.title}"></h2>

                <p class="lead"
                   th:text="#{about.lead}"></p>

                <p th:text="#{about.p1}"></p>

                <p th:text="#{about.p2}"></p>

            </div>
        </div>
    </div>
</section>

<!-- HOW IT WORKS -->
<section class="py-5 bg-white">
    <div class="container text-center">

        <h2 class="section-title"
            th:text="#{how.title}"></h2>

        <div class="row mt-4">

            <div class="col-md-4">
                <h5 th:text="#{how.step1.title}"></h5>
                <p th:text="#{how.step1.desc}"></p>
            </div>

            <div class="col-md-4">
                <h5 th:text="#{how.step2.title}"></h5>
                <p th:text="#{how.step2.desc}"></p>
            </div>

            <div class="col-md-4">
                <h5 th:text="#{how.step3.title}"></h5>
                <p th:text="#{how.step3.desc}"></p>
            </div>

        </div>
    </div>
</section>

<!-- FEATURES -->
<section id="features" class="py-5 bg-light">
    <div class="container">

        <h2 class="section-title"
            th:text="#{features.title}"></h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="feature-card text-center">
                    <h4 th:text="#{features.admin.title}"></h4>
                    <p th:text="#{features.admin.desc}"></p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="feature-card text-center">
                    <h4 th:text="#{features.billing.title}"></h4>
                    <p th:text="#{features.billing.desc}"></p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="feature-card text-center">
                    <h4 th:text="#{features.resident.title}"></h4>
                    <p th:text="#{features.resident.desc}"></p>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- BUILT FOR -->
<section class="py-5 bg-white">
    <div class="container">

        <h2 class="section-title"
            th:text="#{built.title}"></h2>

        <div class="row g-4 mt-4">

            <div class="col-md-6">
                <div class="feature-card h-100">
                    <h4 th:text="#{built.admin.title}"></h4>
                    <ul>
                        <li th:text="#{built.admin.li1}"></li>
                        <li th:text="#{built.admin.li2}"></li>
                        <li th:text="#{built.admin.li3}"></li>
                        <li th:text="#{built.admin.li4}"></li>
                        <li th:text="#{built.admin.li5}"></li>
                    </ul>
                </div>
            </div>

            <div class="col-md-6">
                <div class="feature-card h-100">
                    <h4 th:text="#{built.resident.title}"></h4>
                    <ul>
                        <li th:text="#{built.resident.li1}"></li>
                        <li th:text="#{built.resident.li2}"></li>
                        <li th:text="#{built.resident.li3}"></li>
                        <li th:text="#{built.resident.li4}"></li>
                        <li th:text="#{built.resident.li5}"></li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- FAQ -->
<section class="py-5 bg-light">
    <div class="container">

        <h2 class="section-title"
            th:text="#{faq.title}"></h2>

        <div class="accordion mt-4">

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed"
                            data-bs-toggle="collapse"
                            data-bs-target="#faq1"
                            th:text="#{faq.q1}"></button>
                </h2>
                <div id="faq1" class="accordion-collapse collapse">
                    <div class="accordion-body"
                         th:text="#{faq.a1}"></div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed"
                            data-bs-toggle="collapse"
                            data-bs-target="#faq2"
                            th:text="#{faq.q2}"></button>
                </h2>
                <div id="faq2" class="accordion-collapse collapse">
                    <div class="accordion-body"
                         th:text="#{faq.a2}"></div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed"
                            data-bs-toggle="collapse"
                            data-bs-target="#faq3"
                            th:text="#{faq.q3}"></button>
                </h2>
                <div id="faq3" class="accordion-collapse collapse">
                    <div class="accordion-body"
                         th:text="#{faq.a3}"></div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed"
                            data-bs-toggle="collapse"
                            data-bs-target="#faq4"
                            th:text="#{faq.q4}"></button>
                </h2>
                <div id="faq4" class="accordion-collapse collapse">
                    <div class="accordion-body"
                         th:text="#{faq.a4}"></div>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- CTA -->
<section class="py-5"
         style="background: linear-gradient(90deg, #4e657f, #3f566f);">
    <div class="container text-center text-white">

        <h2 th:text="#{cta.title}"></h2>

        <p th:text="#{cta.subtitle}"></p>

        <a href="/login"
           class="btn btn-lg syntora-btn"
           th:text="#{cta.button}"></a>

        <p th:text="#{cta.note}"></p>

    </div>
</section>

<!-- CONTACT -->
<section id="contact" class="py-5">
    <div class="container">

        <h2 class="section-title"
            th:text="#{contact.title}"></h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5 th:text="#{contact.address.label}"></h5>
                    <p th:text="#{contact.address}"></p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5 th:text="#{contact.email.label}"></h5>
                    <a href="mailto:contact@syntora.com"
                       th:text="#{contact.email}"></a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5 th:text="#{contact.phone.label}"></h5>
                    <a href="tel:+911234567890"
                       th:text="#{contact.phone}"></a>
                </div>
            </div>

        </div>
    </div>
</section>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
