<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Housing Society Bill</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Include sidebar CSS -->
    <th:block th:replace="fragments/sidebar :: sidebar-css"></th:block>

    <style>
        body {
            background-color: #f4f6f9;
        }

        .content-wrapper {
            margin-left: 240px; /* same as sidebar width */
            padding: 40px;
        }

        .bill-container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .bill-header h1 {
            color: #2196F3;
            font-weight: 600;
        }

        .table th {
            background-color: #f8f9fa;
        }

        .btn-warning {
            background-color: #f4b400;
            border: none;
        }

        .btn-primary {
            background-color: #1a73e8;
            border: none;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<th:block th:replace="fragments/sidebar :: sidebar('admin')"></th:block>

<!-- Main Content -->
<div class="content-wrapper">

    <div class="bill-container">

        <div class="text-center mb-4">
            <h1>Housing Society Bill</h1>
            <h5 th:text="${society_name}">Society Name</h5>
        </div>

        <table class="table table-bordered">
            <thead>
            <tr>
                <th>SR NO</th>
                <th>DETAILS</th>
                <th>AMOUNT (Rs.)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${lineItems}">
                <td th:text="${stat.count}"></td>
                <td th:text="${item['charge_name']}"></td>
                <td th:text="${item['amount']}"></td>
            </tr>
            <tr>
                <td></td>
                <td><strong>Due Date</strong></td>
                <td th:text="${formData['due_date']}"></td>
            </tr>
            </tbody>
        </table>

        <table class="table table-bordered">
            <tr>
                <th>Bill For</th>
                <td th:text="${formData['bill_for']}"></td>

                <th>Current Month Total</th>
                <td th:text="${current_month_total}"></td>
            </tr>

            <tr>
                <th>Rupees</th>
                <td th:text="${amount_due_in_words}"></td>

                <th>Arrears</th>
                <td th:text="${formData['arrears']}"></td>
            </tr>

            <tr>
                <th>Building Fund Dues</th>
                <td th:text="${formData['bldg_fund_due']}"></td>

                <th>Amount Due</th>
                <td th:text="${amount_due}"></td>
            </tr>
        </table>

        <div class="text-center mt-4">
            <form th:action="@{/api/bill/modify}" method="post" class="d-inline">
                <button class="btn btn-warning me-2">Modify Bill</button>
            </form>

            <form th:action="@{/api/preview-pdf}" method="get" target="_blank" class="d-inline">
                <button class="btn btn-primary">Generate Bill</button>
            </form>
        </div>

    </div>
</div>

</body>
</html>
