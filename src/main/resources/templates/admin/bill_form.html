<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housing Society Bill Details</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <th:block th:replace="fragments/sidebar :: sidebar-css"></th:block>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fb;
            margin: 0;
            padding: 0;
        }

        .main-content {
            margin-left: 240px; /* Aligns perfectly with sidebar */
            padding: 30px;
        }

        .bill-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .bill-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .bill-header h1 {
            margin: 0;
            font-size: 26px;
            color: #315e87;
            font-weight: 600;
        }

        .bill-header p {
            margin: 5px 0;
            font-size: 14px;
            color: #6b7280;
        }

        .bill-details, .footer-section {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .bill-details th, .bill-details td,
        .footer-section th, .footer-section td {
            border: 1px solid #e5e7eb;
            padding: 12px;
            vertical-align: middle;
        }

        .bill-details th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #374151;
            text-align: center;
        }

        .footer-section th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #374151;
        }

        .btn-update {
            background-color: #2563eb;
            color: white;
            border-radius: 6px;
            padding: 6px 12px;
            border: none;
            transition: background 0.3s;
        }
        .btn-update:hover { background-color: #1d4ed8; }

        .btn-delete {
            background-color: #ef4444;
            color: white;
            border-radius: 6px;
            padding: 6px 12px;
            border: none;
            transition: background 0.3s;
        }
        .btn-delete:hover { background-color: #dc2626; }

        .btn-add {
            background-color: #10b981;
            color: white;
            border-radius: 6px;
            padding: 8px 16px;
            border: none;
            width: 100%;
            transition: background 0.3s;
            font-weight: 500;
        }
        .btn-add:hover { background-color: #059669; }

        .section-title {
            color: #315e87;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 8px;
        }

    </style>
</head>
<body>

<th:block th:replace="fragments/sidebar :: sidebar('admin')"></th:block>

<div class="main-content">
    <div class="bill-container">
        
        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="bill-header">
            <h1><i class="bi bi-pencil-square me-2"></i>Update Bill Details</h1>
            <p>Configure Society Charges and Generate Monthly Bills</p>
        </div>

        <div class="section-title">Active Society Charges</div>
        
        <table class="bill-details">
            <tr>
                <th width="5%">SR NO</th>
                <th width="35%">CHARGE TYPE</th>
                <th width="20%">AMOUNT (Rs.)</th>
                <th width="20%">APPLICABLE TO</th>
                <th width="20%">ACTION</th>
            </tr>
            <!-- Loop through Active Charges -->
            <tr th:each="charge, stat : ${chargeTypes}" th:if="${charge.is_active}">
                <form th:action="@{/api/charges/update/{id}(id=${charge.id})}" method="post">
                    <td th:text="${stat.count}" style="text-align: center;"></td>
                    <td>
                        <input type="text" name="name" th:value="${charge.name}" class="form-control form-control-sm" required>
                    </td>
                    <td>
                        <input type="number" name="defaultAmount" th:value="${charge.default_amount}" class="form-control form-control-sm" step="0.01" min="0" required>
                    </td>
                    <td>
                        <select name="applicableTo" class="form-select form-select-sm">
                            <option value="ALL" th:selected="${charge.applicable_to == 'ALL'}">ALL</option>
                            <option value="OWNER" th:selected="${charge.applicable_to == 'OWNER'}">OWNER</option>
                            <option value="TENANT" th:selected="${charge.applicable_to == 'TENANT'}">TENANT</option>
                        </select>
                    </td>
                    <td style="text-align: center;">
                        <button type="submit" class="btn-update"><i class="bi bi-save me-1"></i>Save</button>
                    </td>
                </form>
            </tr>
            
            <!-- Row to add a New Charge directly inline -->
            <tr style="background-color: #f0fdf4;">
                <form th:action="@{/api/charges/add}" method="post">
                    <td style="text-align: center;"><i class="bi bi-plus-circle text-success"></i></td>
                    <td>
                        <input type="text" name="name" class="form-control form-control-sm" placeholder="New Charge Name" required>
                    </td>
                    <td>
                        <input type="number" name="defaultAmount" class="form-control form-control-sm" placeholder="0.00" step="0.01" min="0" required>
                    </td>
                    <td>
                        <select name="applicableTo" class="form-select form-select-sm">
                            <option value="ALL">ALL</option>
                            <option value="OWNER">OWNER</option>
                            <option value="TENANT">TENANT</option>
                        </select>
                    </td>
                    <td style="text-align: center;">
                        <button type="submit" class="btn-add"><i class="bi bi-plus me-1"></i>Add</button>
                    </td>
                </form>
            </tr>
        </table>

        <div class="section-title">Generate Monthly Bills</div>
        <p class="text-muted small mb-3">Snapshot the above charges to generate bills for all residents.</p>
        
        <form th:action="@{/api/charges/generate-bills}" method="post">
            <table class="footer-section">
                <tr>
                    <th width="20%">Bill For Month:</th>
                    <td width="30%">
                        <select name="month" class="form-select" required>
                            <option value="january">January</option>
                            <option value="february">February</option>
                            <option value="march">March</option>
                            <option value="april">April</option>
                            <option value="may">May</option>
                            <option value="june">June</option>
                            <option value="july">July</option>
                            <option value="august">August</option>
                            <option value="september">September</option>
                            <option value="october">October</option>
                            <option value="november">November</option>
                            <option value="december">December</option>
                        </select>
                    </td>
                    <th width="20%">Bill Year:</th>
                    <td width="30%">
                        <input type="number" name="year" id="billYear" class="form-control" required>
                    </td>
                </tr>
                <tr>
                    <th>Due Date:</th>
                    <td colspan="3"><input type="date" name="dueDate" class="form-control" required></td>
                </tr>
            </table>
            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="bi bi-lightning-charge me-2"></i>Generate Bills
                </button>
            </div>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('billYear').value = new Date().getFullYear();
</script>
</body>
</html>
