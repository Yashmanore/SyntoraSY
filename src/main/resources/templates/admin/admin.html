<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Dashboard</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <th:block th:replace="fragments/sidebar :: sidebar-css"></th:block>

    <style>
        :root {
            --brand-primary: #315e87;
            --brand-primary-dark: #274f75;
            --brand-accent: #c9a227;

            --bg-main: #f4f7fb;
            --bg-soft: #eaf1f8;
            --sidebar-bg: #0f172a;

            --danger: #dc2626;
        }

        /* Page background */
        body {
            background: var(--bg-main);
        }

        /* Top header */
        .admin-header {
            margin-left: 240px;
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 28px;
            border-bottom: 1px solid #e5e7eb;
        }

        .admin-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            color: var(--brand-primary);
        }

        /* Main content */
        .main-content {
            margin-left: 240px;
            padding: 32px;
        }

        /* Form area */
        #add-note-form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }

        /* Brand Button */
        .brand-btn {
            background: var(--brand-primary);
            color: white;
            border: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all .2s ease;
        }

        .brand-btn:hover {
            background: var(--brand-primary-dark);
            transform: translateY(-1px);
        }

        /* Notes container */
        .sticky-notes-container {
            margin-top: 30px;
            padding: 30px;
            border-radius: 16px;
            background: var(--bg-soft);
        }

        /* Sticky note */
        .sticky-notes-container {
            margin-top: 30px;
            padding: 30px;
            border-radius: 16px;
            background: #eef3f9;

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .sticky-note {
            position: relative;
            background: white;
            padding: 22px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
             box-shadow: 0 4px 10px rgba(0,0,0,0.04), 0 12px 24px rgba(53,105,153,0.08);
            transition: all 0.25s ease;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
        }

        .sticky-note:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(53,105,153,0.12);
        }

        .sticky-note h6 {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--brand-primary);
        }

        .sticky-note p {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 16px;
        }

        .sticky-note::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--brand-accent);
            border-radius: 50%;
            position: absolute;
            top: 12px;
            right: 16px;
        }

        .sticky-note h6 {
            color: var(--brand-primary);
            font-weight: 600;
        }

        .sticky-note button {
            align-self: flex-start;
            background: var(--danger);
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>

<body>

<!-- Navbar Fragment -->
<th:block th:replace="fragments/sidebar :: sidebar('admin')"></th:block>


<div class="admin-header">
    <h2>Sticky Notes</h2>
    <div class="ms-auto">
        <span class="text-muted small">Admin Panel</span>
    </div>
</div>

<div class="main-content">

    <!-- Add New Note Form -->
    <form id="add-note-form">
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" id="note-title" name="title" class="form-control" required>Add Title
            </div>
            <div class="col-md-6">
                <input type="text" id="note-message" name="message" class="form-control" required>Add message
            </div>
            <div class="col-md-2">
                <button class="btn w-100 brand-btn">Add Note</button>
            </div>
        </div>
    </form>

    <div id="note-response"></div>

    <!-- Notes -->
    <div class="sticky-notes-container">
        <div class="sticky-note" th:each="note : ${notes}">
            <h6 th:text="${note.title}">Title</h6>
            <p th:text="${note.message}">Message</p>

            <button class="delete-btn" th:data-sid="${note.sid}" th:data-title="${note.title}">Delete</button>
        </div>
    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById("add-note-form").addEventListener("submit", function (e) {
        e.preventDefault();

        const title = document.getElementById("note-title").value;
        const message = document.getElementById("note-message").value;

        fetch("/admin/add_note", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ title: title, message: message })
        })
        .then(response => response.json())
        .then(data => {
            const responseDiv = document.getElementById("note-response");
            if (data.success) {
                responseDiv.innerText = data.message;
                responseDiv.style.color = "green";
                document.getElementById("add-note-form").reset();
                setTimeout(() => location.reload(), 1000); // Refresh to show new note
            } else {
                responseDiv.innerText = data.error || "Error adding note.";
                responseDiv.style.color = "red";
            }
        })
        .catch(error => {
            console.error("Error:", error);
            const responseDiv = document.getElementById("note-response");
            responseDiv.innerText = "Error occurred.";
            responseDiv.style.color = "red";
        });
    });

    document.querySelectorAll('.delete-btn').forEach(button => {
        button.addEventListener('click', () => {
            const sid = button.getAttribute('data-sid');
            const title = button.getAttribute('data-title');
            deleteNote(sid, title);
        });
    });


    function deleteNote(sid, title) {
        fetch('/admin/delete_note', {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ sid: sid, title: title })
        })
        .then(response => response.text())
        .then(data => {
            console.log(data);
            location.reload();
        });
    }

</script>

</body>
</html>
